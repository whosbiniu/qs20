name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website encryption
        run: |
          node scripts/test-site-lock.mjs
          node scripts/test-vercel-auth.mjs
          node scripts/test-day-highs.cjs
          node scripts/test-terminal-data.cjs
          node scripts/test-terminal-studies.cjs
          node scripts/test-terminal-studies-chart.cjs
          node scripts/test-asset-versions.mjs
          node scripts/test-terminal-extra.cjs
          node scripts/test-storage.cjs
          node scripts/test-terminal-workspace.cjs
          node scripts/test-hl-stream.cjs
          node scripts/test-hyper-terminal.cjs
          node scripts/test-terminal-orderflow.cjs
          node scripts/test-orderflow-analysis.cjs
          node scripts/test-terminal-indicators.cjs
          node scripts/test-terminal-profile.cjs
      - name: Prepare static site and calendar data
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
