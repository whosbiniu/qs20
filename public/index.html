<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNC Terminal</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-icon.png">
<link rel="stylesheet" href="hyper-terminal.css">
<link rel="stylesheet" href="terminal-workspace.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="post-creator.css">
<style>
:root{--bg:#050505;--line:#3a3a34;--ink:#ebe6d3;--dim:#8c8a7c;--faint:#1c1c19}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
body{display:flex;flex-direction:column;padding:10px;gap:10px}
.bar{display:flex;align-items:center;gap:16px;color:var(--dim)}
.bar .brand{color:var(--ink);letter-spacing:.2em;display:inline-flex;align-items:center;gap:9px}
.bar .brand img{width:22px;height:22px;filter:drop-shadow(0 0 6px rgb(var(--ink-rgb)/.2))}
html[data-color-mode=light] .bar .brand img{filter:invert(1) hue-rotate(180deg)}
.bar .clock{margin-left:0}
.modes{display:flex;gap:6px;margin-left:auto;align-items:center}.modes+.swatches{margin-left:14px}
.modes button{width:24px;height:22px;padding:0;display:grid;place-items:center;background:transparent;border:1px solid var(--line);color:var(--dim);cursor:pointer}
.modes button:hover{color:var(--ink);border-color:var(--ink)}.modes button.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.modes svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.swatches{display:flex;gap:7px;margin-left:auto;align-items:center}
.swatches button{width:14px;height:14px;border:1px solid var(--line);background:var(--sw);padding:0;cursor:pointer}
.swatches button.active{outline:1px solid var(--ink);outline-offset:2px}
nav{display:flex;align-items:stretch;border:1px solid var(--line)}
nav button{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);font:inherit;padding:8px 16px;cursor:pointer;text-transform:uppercase;letter-spacing:.12em}
nav button b{margin-right:8px;font-weight:400;opacity:.6}
nav button:hover{color:var(--ink)}
nav button.active{background:var(--ink);color:var(--bg)}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 10px}
.tools span{color:var(--dim);margin-right:4px}
.tools button{border:1px solid var(--line);padding:3px 10px;letter-spacing:.08em}
.tools button.active{border-color:var(--ink)}
.tools .side-toggle{margin-left:10px}
#tape{overflow:hidden;border-bottom:1px solid var(--faint);padding:5px 0;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tape .track{display:flex;width:max-content;animation:tape 900s linear infinite}
#tape:hover .track{animation-play-state:paused}
#tape .q{display:flex;gap:8px;padding:0 16px;color:var(--dim);white-space:nowrap}
#tape .q b{color:var(--ink);font-weight:400}
@keyframes tape{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#tape .track{animation:none}#tape{overflow-x:auto}}
.shell{flex:1;min-height:0;display:flex;gap:10px}
main{flex:1;min-width:0;position:relative}
#side{width:300px;flex:none;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px 12px}
#side h4,.news-page h4{margin:0 0 8px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.16em;font-weight:700}
#side h4 i{font-style:normal;font-weight:400;color:var(--dim);letter-spacing:0;text-transform:none}
.feed{flex:1;min-height:0;overflow-y:auto;scrollbar-color:var(--line) var(--bg);scrollbar-width:thin}
.item{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--faint);color:var(--ink);text-decoration:none}
.item:hover .t{text-decoration:underline;text-underline-offset:3px}
.item time{flex:none;color:var(--dim);width:38px}
.item.new .t{font-weight:700}
.lang{background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:11px;padding:1px 7px;cursor:pointer}
.newsbar{display:flex;gap:8px}.newsbar input{flex:1}
.tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
nav button,.tools button{white-space:nowrap}
.home-bar{display:flex;align-items:center;gap:10px;color:var(--dim);padding-bottom:8px;position:absolute;top:0;left:0;right:0;height:32px}
.home-bar b{color:var(--ink);letter-spacing:.16em;text-transform:uppercase}
#homeAdd{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}#homeAdd::-webkit-scrollbar{display:none}#homeAdd button{flex:none}.home-bar b{flex:none}
#homeAdd button{background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;padding:2px 8px;cursor:pointer}
#homeAdd button:hover{color:var(--ink);border-color:var(--ink)}
.home-grid{position:absolute;top:36px;left:0;right:0;bottom:0;overflow-y:auto;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--line) var(--bg)}
.home-grid.resizing{user-select:none}.home-grid.resizing iframe{pointer-events:none}
.widget{border:1px solid var(--line);height:var(--h);grid-column:span var(--span,6);display:flex;flex-direction:column;min-width:0;position:relative}
.widget>header{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-weight:400;height:auto}
.widget>header b{letter-spacing:.14em;text-transform:uppercase}
.widget>header button{background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;width:24px;height:22px;padding:0;cursor:pointer}
.widget>header button:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.widget>header button:disabled{opacity:.3;cursor:default}
.widget .rs{position:absolute;z-index:5}
.widget .rs-e{top:0;right:-4px;bottom:14px;width:8px;cursor:ew-resize}
.widget .rs-s{left:0;right:14px;bottom:-4px;height:8px;cursor:ns-resize}
.widget .rs-se{right:-2px;bottom:-2px;width:16px;height:16px;cursor:nwse-resize;display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 3px;opacity:.45}
.widget .rs-se svg{width:9px;height:9px;stroke:var(--ink);stroke-width:1.3}
.widget .rs-e:hover,.widget .rs-s:hover{background:rgb(var(--ink-rgb)/.14)}
.widget .rs-se:hover{opacity:1}
.wbody{flex:1;min-height:0;position:relative;overflow:hidden}
.wbody>.feed{position:absolute;inset:0;padding:0 10px}
.wbody iframe{border:0}
.page.in-widget{position:relative!important;inset:auto!important;height:100%}
.mon{position:absolute;inset:0;display:flex;gap:10px}
.mon-main{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line)}
.mon-bar,.mon-foot{display:flex;align-items:center;gap:10px;padding:6px 10px;color:var(--dim)}
.mon-bar{border-bottom:1px solid var(--line)}.mon-foot{border-top:1px solid var(--line);flex-wrap:wrap}
.grow{flex:1}
#monLayers{display:flex;gap:6px}
.mon-bar button{background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;padding:3px 10px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em}
.mon-bar button:hover{color:var(--ink);border-color:var(--ink)}
.mon-bar button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mon-bar button i{font-style:normal;opacity:.7;margin-left:4px}
.mon-map{flex:1;min-height:0;position:relative;overflow:hidden}
.mon-map canvas{display:block;cursor:grab;touch-action:none}
#monTip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--ink);padding:6px 9px;max-width:250px}
#monTip b{display:block;font-weight:700}
.mon-side{width:290px;flex:none;border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) var(--bg)}
.mon-side h4{margin:10px 0 6px;text-transform:uppercase;letter-spacing:.16em;font-weight:700}
.mon-side h4:first-child{margin-top:0}
.mon-side h4 i{font-style:normal;font-weight:400;color:var(--dim);letter-spacing:0;text-transform:none}
.mon-side .feed{flex:none;max-height:32vh;overflow-y:auto}
.sel{border:1px solid var(--line);padding:8px 10px;line-height:1.5}
.sel b{display:block}.sel .dim{color:var(--dim)}.sel a{color:var(--ink);text-underline-offset:3px;display:inline-block;margin-top:4px}
@media(max-width:1100px){.mon-side{display:none}}
.feed .none{color:var(--dim);padding:8px 0}
.news-page{position:absolute;inset:0;border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.news-page input{background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;padding:8px 10px;color-scheme:inherit}
.news-page .item{font-size:13px;padding:9px 0}
.news-page .item time{width:90px}
@media(max-width:1100px){#side{display:none}}
.page{position:absolute;inset:0}
[hidden]{display:none!important}
#charts{display:grid;grid-template:1fr 1fr / 1fr 1fr;gap:10px}
#charts.n1{grid-template:1fr / 1fr}
#charts.n2{grid-template:1fr / 1fr 1fr}
#charts.n3 .cell:nth-child(3){grid-column:1 / -1}
.cell.active{border-color:var(--ink)}
#lay button{padding:3px 6px;line-height:0}
#lay svg{width:18px;height:14px;fill:none;stroke:currentColor;stroke-width:1}
#tape .q{cursor:pointer}
#tape .q:hover b{text-decoration:underline;text-underline-offset:3px}
.cell{border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 12px 8px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.head .sym{font:inherit;font-weight:700;width:9ch;margin-right:10px;padding:1px 4px;background:transparent;color:var(--ink);border:1px solid transparent;text-transform:uppercase}
.head .sym:hover{border-color:var(--line)}.head .sym:focus{border-color:var(--ink);outline:none}
.head .name{color:var(--dim)}
.sub{color:var(--dim);margin-bottom:8px}
.body{flex:1;min-height:0;display:flex;gap:14px}
.chart{flex:1;min-width:0;position:relative}
.draw-layer{position:absolute;inset:0;z-index:3;pointer-events:none;touch-action:none}
.draw-bar{position:absolute;left:6px;top:6px;z-index:4;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;max-height:calc(100% - 40px);gap:3px;opacity:.55;transition:opacity .15s}
.chart:hover .draw-bar,.draw-bar:focus-within{opacity:1}
.draw-bar button{width:24px;height:24px;padding:0;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.draw-bar button:hover{color:var(--ink);border-color:var(--ink)}
.draw-bar button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.draw-bar button.armed{border-color:var(--ink);color:var(--ink);outline:1px dashed var(--ink)}
.draw-text{position:absolute;z-index:5;transform:translateY(-50%);min-width:160px;padding:2px 4px;background:var(--bg);color:var(--ink);border:1px solid var(--ink);font:13px ui-monospace,Menlo,monospace;outline:none}
.draw-bar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.2}
.twin{width:196px;flex:none;display:flex;flex-direction:column}
.twin h4{margin:0 0 4px;display:flex;justify-content:space-between;font-weight:700}
.twin h4 i{font-style:normal;font-weight:400;color:var(--dim)}
.twin div.r{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-top:1px solid var(--faint)}
.twin div.r span{color:var(--dim)}
@media(max-height:1100px){.twin .frame{display:none}}
.twin .r.cyc{border-top-color:var(--line)}
.twin .r.cyc b{font-weight:400;letter-spacing:.02em;white-space:nowrap}
.twin .r.cyc span{cursor:help}
.twin .frame{margin-top:auto;border:1px solid var(--line);padding:6px 8px;color:var(--dim)}
.twin .frame b{color:var(--ink);display:block}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:20px}
iframe{width:100%;height:100%;border:1px solid var(--line);background:var(--bg)}
footer{display:flex;gap:18px;color:var(--dim)}
footer .live.bad{text-decoration:underline dotted}
footer .live{color:var(--ink)}
footer .credit{margin-left:auto;letter-spacing:.08em}

/* ---- phones and small tablets ---- */
@supports(height:100dvh){html,body{height:100dvh}}
@media(max-width:800px){
  body{padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:6px}
  .bar{flex-wrap:wrap;gap:6px 10px}
  .bar .brand{font-size:11px}
  .bar .clock{font-size:11px}
  nav{flex-wrap:wrap}
  .tabs{flex:none;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;padding:11px 13px;flex:none}
  nav button b{display:none}
  .tools{flex:1 1 auto;width:auto;margin-left:0!important;padding:5px 8px;border-top:1px solid var(--line);overflow-x:auto;flex-wrap:nowrap;justify-content:center}
  .tools span{display:none}
  #tape{display:none}
  .tools button{padding:6px 12px;min-height:32px;flex:none}
  #lay button{padding:6px 8px}
  .tools .side-toggle{display:none}
  #tape{padding:4px 0}
  #tape .q{padding:0 10px}
  .shell{gap:0}
  main{overflow:hidden}
  /* charts: one column, page scrolls; the numbers sit under each chart */
  #charts,#charts.n1,#charts.n2,#charts.n3,#charts.n4{grid-template:none;grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;align-content:start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #charts.n3 .cell:nth-child(3){grid-column:auto}
  .cell{min-height:0;padding:8px;height:auto}
  .cell .body{flex-direction:column;min-height:0;flex:none}
  .chart{flex:none;height:min(58vh,380px);min-width:0}
  .twin{width:100%;flex:none;margin-top:8px}
  .twin .rows,.twin .cycles{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
  .twin h4{display:none}
  .twin .frame{display:none}
  .head{flex-wrap:wrap}
  .head .sym{font-size:16px;width:10ch;min-height:32px}
  .head .px{width:100%}
  .draw-bar{opacity:1;flex-direction:row;flex-wrap:wrap;width:calc(100% - 12px)}
  .draw-bar button{width:30px;height:30px}
  #side{display:none}
  .page{position:relative;inset:auto;min-height:0}
  main{flex:1;min-height:0;position:relative}
  .page{position:absolute;inset:0}
  .news-page{padding:8px}
  .item{font-size:13px}
  .news-page .item time{width:52px}
  /* dashboard */
  /* the whole dashboard scrolls as one page instead of nesting scrollers */
  #home{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .home-bar{position:static;flex-wrap:wrap;height:auto;padding-bottom:8px}
  .home-grid{position:static;overflow:visible;grid-template-columns:minmax(0,1fr)}
  .widget{grid-column:1/-1!important;height:min(var(--h),80vh);margin-bottom:0}
  .widget .rs-e,.widget .rs-se{display:none}
  /* monitor: map on top, lists below */
  .mon{flex-direction:column;overflow-y:auto;gap:8px}
  .mon-main{flex:none;height:62vh}
  .mon-side,.mon-side{display:flex;width:auto;flex:none;overflow:visible}
  .mon-bar{flex-wrap:wrap}
  .mon-foot{font-size:10px}
  footer{flex-wrap:wrap;gap:4px 12px;font-size:11px}
  input,select,textarea{font-size:16px}
}
@media(max-width:800px) and (orientation:landscape){.chart{height:70vh}}

/* ---- Inne: heat map, correlations, yields, seasonality, earnings, journal, COT, AI ---- */
#other .ot{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px}
.ot-nav{display:flex;flex-wrap:wrap;border:1px solid var(--line)}
.ot-nav button{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);font:inherit;padding:7px 13px;cursor:pointer;text-transform:uppercase;letter-spacing:.1em}
.ot-nav button:hover{color:var(--ink)}.ot-nav button.active{background:var(--ink);color:var(--bg)}
.ot-body{flex:1;min-height:0;position:relative}
.ot-pane{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line) var(--bg)}
.ot-pane>*{flex-shrink:0}
.ot-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:var(--dim);background:none;height:auto;padding:0}
.ot-head>b{color:var(--ink);text-transform:uppercase;letter-spacing:.16em}
.ot-status.err{color:var(--ink);text-decoration:underline dotted}
.ot-form{display:flex;gap:6px;flex-wrap:wrap}.ot-form input{min-width:220px}
.ot-pane input,.ot-pane select,.ot-pane textarea{background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;padding:4px 7px;color-scheme:dark}
html[data-color-mode=light] .ot-pane input,html[data-color-mode=light] .ot-pane select,html[data-color-mode=light] .ot-pane textarea{color-scheme:light}
.ot-pane button,.ot-mini{background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;padding:4px 10px;cursor:pointer}
.ot-pane button:hover,.ot-mini:hover{border-color:var(--ink)}
.ot-mini{padding:2px 8px;color:var(--dim)}.ot-mini[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ot-card{border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.ot-card h4{margin:0 0 6px;display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em}.ot-card h4 i{font-style:normal;font-weight:400;color:var(--dim)}
.ot-split{display:flex;gap:8px;flex-wrap:wrap;min-height:0}.ot-split>.ot-card{flex:1 1 340px}.ot-split>.ot-card.grow{flex:2 1 460px}
.ot-map{position:relative;flex:1 0 420px;border:1px solid var(--line);overflow:hidden}
.ot-sector{position:absolute;box-sizing:border-box;border:1px solid var(--bg)}.ot-sector>span{position:absolute;left:4px;top:1px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;max-width:calc(100% - 8px)}
.ot-cell{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;border-radius:2px;line-height:1.15}
.ot-cell:hover{outline:2px solid var(--ink);z-index:2}.ot-cell small{font-size:10px}
.ot-legend-bar{display:flex;align-items:center;gap:6px}.ot-ramp{display:inline-block;width:120px;height:8px;border-radius:2px}.ot-legend-bar i{font-style:normal}
.ot-legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--dim);font-size:11px;margin-bottom:4px}.ot-legend i,.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ot-lw{flex:1;min-height:260px;position:relative}.ot-lw.small{min-height:120px;flex:none;height:120px}
.ot-svg{width:100%;height:240px;display:block}.ot-svg text{fill:var(--dim);font:10px ui-monospace,Menlo,monospace}.ot-svg text.lbl{fill:var(--ink);font-size:11px}.ot-svg text.small{font-size:10px}
.ot-svg .grid{stroke:var(--faint);stroke-width:1}.ot-svg .grid.dashed{stroke:var(--line);stroke-dasharray:4 4}.ot-svg .base{stroke:var(--line);stroke-width:1}.ot-svg .cross{stroke:var(--dim);stroke-dasharray:3 3}
.ot-table{overflow:auto}.ot-matrix,.ot-years{overflow-x:auto;max-width:100%}.ot-table table{width:100%;border-collapse:collapse;font-size:12px}.ot-table th{color:var(--dim);font-weight:400;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.ot-table td{padding:5px 8px;border-bottom:1px solid var(--faint);font-variant-numeric:tabular-nums}
.ot-corr td{text-align:center;min-width:52px;border:2px solid var(--bg)}.ot-corr th{text-align:center}
.ot-heat td{text-align:center;border:1px solid var(--bg);font-size:11px;padding:3px 4px}
.ot-tiles{display:flex;flex-wrap:wrap;gap:8px}.ot-tile{border:1px solid var(--line);padding:6px 12px;display:flex;flex-direction:column;min-width:120px}.ot-tile small{color:var(--dim)}.ot-tile b{font-size:18px;font-weight:600}.ot-tile span{color:var(--dim);font-size:11px}
.ot-tip{position:absolute;z-index:40;pointer-events:none;background:var(--bg);border:1px solid var(--ink);padding:6px 9px;font-size:11px;line-height:1.5;max-width:320px}
.ot-empty{color:var(--dim);padding:8px 0}
.ot-warn{margin:0;padding:6px 10px;border:1px solid var(--ink);color:var(--ink)}
.ot-bar{display:inline-block;width:70px;height:6px;border:1px solid var(--line);vertical-align:middle;margin-right:6px}.ot-bar span{display:block;height:100%;background:var(--ink)}
.ot-journal-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 10px;align-items:end;border:1px solid var(--line);padding:8px 10px}

<script>
// Kalendarz przekierowuje do widoku wydarzeń z qs2.0 (Timeline/Wydarzenia).
const CALENDAR_URL = 'quarters/index.html#events'
const QUARTERS_URL = 'quarters/index.html'
const HIGHS_URL = 'quarters/highs.html'
const TABS = ['home', 'charts', 'hyper-terminal', 'post-creator', 'calendar', 'news', 'quarters', 'highs', 'monitor', 'other']
const DEFAULTS = ['NQ1!', 'ES1!', 'YM1!', 'DXY1!']
const PRESETS = ['NQ1!', 'ES1!', 'XYZ100', 'SP500', 'YM1!', 'RTY1!', 'DXY1!', 'BTC1!', 'ETH1!', 'GC1!', 'SI1!', 'CL1!', 'NG1!', 'ZN1!', '6E1!', 'BTC-USD', 'ETH-USD', 'SOL-USD', 'AAPL', 'NVDA', 'TSLA', 'SPY', 'QQQ']
let saved = []
try { saved = JSON.parse(localStorage.getItem('symbols') || '[]') } catch {}
const SYMBOLS = DEFAULTS.map((d, i) => /^[A-Z0-9][A-Z0-9.^=!-]{0,14}$/.test(saved[i] || '') ? saved[i] : d)
const FRAMES = ['1M', '1W', '1D', '6H']
let frame = localStorage.getItem('frame')
if (!FRAMES.includes(frame)) frame = '1D'

// Colours come from the active theme (CSS variables), so charts follow the colour picker.
const chartTheme = () => {
  const dim = Theme.css('--dim'), line = Theme.css('--line')
  return {
    layout: { background: { color: Theme.css('--bg') }, textColor: dim, fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 11 },
    grid: { vertLines: { visible: false }, horzLines: { color: Theme.css('--faint'), style: 1 } },
    rightPriceScale: { borderColor: line },
    timeScale: { borderColor: line },
    crosshair: { vertLine: { color: dim, labelBackgroundColor: line }, horzLine: { color: dim, labelBackgroundColor: line } },
  }
}
const seriesTheme = () => {
  const ink = Theme.css('--ink')
  return { upColor: ink, downColor: Theme.css('--bg'), borderUpColor: ink, borderDownColor: ink, wickUpColor: ink, wickDownColor: ink, priceLineColor: ink }
}
const $ = id => document.getElementById(id)
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const row = (k, v) => `<div class="r"><span>${k}</span>${v}</div>`

const panels = SYMBOLS.map((symbol, i) => {
  const cell = document.createElement('div')
  cell.className = 'cell'
  cell.innerHTML = `
    <div class="head"><div><input class="sym" list="presets" value="${symbol}" spellcheck="false" autocomplete="off" aria-label="Ticker" title="Wpisz ticker (np. BTC1!, ETH1!, GC1!, AAPL) i naciśnij Enter"><span class="name nm"></span></div><span class="name px"></span></div>
    <div class="sub">1 candle = 1 period · <span class="tfl"></span></div>
    <div class="body"><div class="chart"></div>
      <aside class="twin"><h4>numeric twin <i>as values</i></h4><div class="rows"></div><div class="cycles"></div>
        <div class="frame"><b class="fsym">${symbol}</b>Yahoo Finance<br>panel 0${i + 1}/04</div></aside></div>`
  cell.addEventListener('pointerdown', () => setActive(i), true)
  $('charts').append(cell)
  const el = cell.querySelector('.chart')
  const chart = LightweightCharts.createChart(el, {
    autoSize: true, ...chartTheme(),
    handleScroll: { vertTouchDrag: false },
    timeScale: { ...chartTheme().timeScale, timeVisible: true, secondsVisible: false, rightOffset: 8 },
    crosshair: { mode: 0, ...chartTheme().crosshair },
  })
  // Monochrome candles: up = filled, down = hollow outline.
  const series = chart.addSeries(LightweightCharts.CandlestickSeries, {
    ...seriesTheme(), priceLineStyle: 3, priceLineWidth: 1,
  })
  const panel = { symbol, cell, el, chart, series, tick: null, input: cell.querySelector('.sym') }
  panel.drawings = Drawings.attach(panel)
  panel.input.onchange = () => setSymbol(panel, panel.input.value)
  panel.input.onkeydown = e => { if (e.key === 'Enter') panel.input.blur() }
  panel.input.onfocus = () => panel.input.select()
  return panel
})
window.addEventListener('themechange', () => panels.forEach(p => { p.chart.applyOptions(chartTheme()); p.series.applyOptions(seriesTheme()) }))
$('swatches').innerHTML = Object.entries(Theme.THEMES).map(([id, t]) => `<button data-theme="${id}" title="${t.label}" aria-label="Kolor: ${t.label}" style="--sw:${Theme.swatch(id)}"></button>`).join('')
$('swatches').onclick = e => { const id = e.target.closest('[data-theme]')?.dataset.theme; if (id) Theme.set(id) }
const markTheme = () => {
  $('swatches').querySelectorAll('button').forEach(b => { b.classList.toggle('active', b.dataset.theme === Theme.get()); b.style.setProperty('--sw', Theme.swatch(b.dataset.theme)) })
  $('modes').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === Theme.getMode()))
}
$('modes').onclick = e => { const m = e.target.closest('[data-mode]')?.dataset.mode; if (m) Theme.setMode(m) }
window.addEventListener('themechange', markTheme)
markTheme()
// Glass: transparency (live while dragging, saved on release) and, in the browser, a wallpaper of your own.
const glassShow = () => { const v = Math.round(Theme.getGlass() * 100); $('glassClear').value = v; $('glassOut').textContent = v + ' %' }
$('glassClear').addEventListener('input', e => { Theme.setGlass(e.target.value / 100, false); glassShow() })
$('glassClear').addEventListener('change', e => { Theme.setGlass(e.target.value / 100, true); glassShow() })
window.addEventListener('themechange', glassShow)
glassShow()
function glassWall(url) {
  document.documentElement.style[url ? 'setProperty' : 'removeProperty']('--glass-wall', url ? `url("${url}")` : '')
  $('glassWallReset').hidden = !url
}
try { glassWall(localStorage.getItem('glass-wall')) } catch {}
$('glassWall').onclick = () => $('glassFile').click()
$('glassWallReset').onclick = () => { try { localStorage.removeItem('glass-wall') } catch {} glassWall(null) }
// The picture is scaled to at most 1920 px and stored as JPEG (a few hundred kB), not as the original file.
$('glassFile').addEventListener('change', async e => {
  const file = e.target.files?.[0]; e.target.value = ''
  if (!file || !file.type.startsWith('image/')) return
  try {
    const image = await createImageBitmap(file), scale = Math.min(1, 1920 / image.width)
    const canvas = document.createElement('canvas'); canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale)
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height)
    const url = canvas.toDataURL('image/jpeg', .82)
    if (!Store.set('glass-wall', url)) { alert('Obraz nie zmieścił się w pamięci przeglądarki. Wybierz mniejszy.'); return }
    glassWall(url)
  } catch { alert('Nie udało się wczytać tego obrazu.') }
})
document.body.insertAdjacentHTML('beforeend', `<datalist id="presets">${PRESETS.map(p => `<option value="${p}">`).join('')}</datalist>`)

async function setSymbol(p, raw) {
  const symbol = raw.trim().toUpperCase().replace(/\s+/g, '')
  if (!symbol || symbol === p.symbol) { p.input.value = p.symbol; return }
  const previous = p.symbol
  p.symbol = symbol
  p.loaded = null
  if (await load(p)) {
    p.input.value = symbol
    p.drawings.reload()
    localStorage.setItem('symbols', JSON.stringify(panels.map(x => x.symbol)))
  } else {
    // Unknown ticker: restore the previous chart instead of leaving an empty panel.
    p.symbol = previous
    p.input.value = previous
    p.loaded = null
    await load(p)
    p.el.querySelector('.err')?.remove()
    p.cell.querySelector('.nm').textContent = `„${symbol}” — nie znaleziono danych`
  }
}

// Cycle of each extreme, from the timeline's rules: [Quarterly, Monthly, Weekly] for the month,
// [Monthly, Weekly, Daily] for the week and [Weekly, Daily, Session] for the day.
const CYCLES = [
  ['HOTM', 'hotm', 'High of the month: Quarterly · Monthly · Weekly'], ['LOTM', 'lotm', 'Low of the month: Quarterly · Monthly · Weekly'],
  ['HOTW', 'hotw', 'High of the week: Monthly · Weekly · Daily'], ['LOTW', 'lotw', 'Low of the week: Monthly · Weekly · Daily'],
  ['HOTD', 'hotd', 'High of the day: Weekly · Daily · Session'], ['LOTD', 'lotd', 'Low of the day: Weekly · Daily · Session'],
]
const cycleRows = (d, waiting) => CYCLES.map(([k, key, tip]) =>
  `<div class="r cyc"><span title="${tip}">${k}</span><b>${d?.[key] ? d[key].join(' · ') : waiting ? '…' : '—'}</b></div>`).join('')
// The last good answers stay in the browser: a new visit paints charts, cycles, tape and headlines at once and
// swaps in fresh data as it arrives (stale-while-revalidate on the client).
const stash = Stash   // storage.js: a size-limited, least-recently-used cache of these copies

// Footer status: live when the data feeds answer (charts, tape, headlines), whichever page is open.
const feeds = {}
function feedStatus(name, ok) {
  feeds[name] = ok
  const states = Object.values(feeds), good = states.filter(Boolean).length
  $('status').textContent = !good ? '● brak połączenia z danymi' : good < states.length ? '● na żywo · część źródeł niedostępna' : '● na żywo'
  $('status').classList.toggle('bad', !good)
  $('updated').textContent = 'aktualizacja: ' + new Date().toLocaleTimeString('pl-PL')
}
const cycleCache = {}
async function loadCycles(p) {
  const symbol = p.symbol
  const box = p.cell.querySelector('.cycles')
  if (cycleCache[symbol] && Date.now() - cycleCache[symbol].at < 60000) { box.innerHTML = cycleRows(cycleCache[symbol].data); return }
  if (p.cyclesFor !== symbol) { const saved = stash.get('highs:' + symbol); box.innerHTML = saved ? cycleRows(saved) : cycleRows(null, true) }
  p.cyclesFor = symbol
  try {
    const r = await fetch('/api/highs?symbol=' + encodeURIComponent(symbol))
    const data = await r.json()
    if (!r.ok) throw new Error(data.error)
    cycleCache[symbol] = { at: Date.now(), data }
    stash.put('highs:' + symbol, data)
    if (p.symbol === symbol) box.innerHTML = cycleRows(data)
  } catch { if (p.symbol === symbol) box.innerHTML = cycleRows(null) }
}

// Slowly scrolling tape of the most followed instruments (built once, values refreshed in place).
const tapeFmt = n => n.toLocaleString('en-US', { minimumFractionDigits: n < 10 ? 4 : 2, maximumFractionDigits: n < 10 ? 4 : 2 })
function renderTape(quotes) {
    const cell = q => `<span class="q" data-s="${q.symbol}" data-c="${q.chart || ''}" title="Otwórz na wykresie"><b>${q.symbol}</b>${tapeFmt(q.price)}<span>${q.change == null ? '' : (q.change >= 0 ? '+' : '−') + Math.abs(q.change).toFixed(2) + '%'}</span></span>`
    const track = $('tapeTrack')
    if (track.children.length === quotes.length * 2) {
      // Same instruments: update text only so the scroll position is not reset.
      track.querySelectorAll('.q').forEach((el, i) => { const q = quotes[i % quotes.length]; el.innerHTML = cell(q).replace(/^<span[^>]*>|<\/span>$/g, '') })
    } else {
      const html = quotes.map(cell).join('')
      track.innerHTML = html + html
      // ~5 s per instrument keeps it readable.
      track.style.animationDuration = quotes.length * 5 + 's'
    }
}
async function loadTape() {
  try {
    const { quotes } = await (await fetch('/api/tape')).json()
    if (!quotes.length) return
    stash.put('tape', quotes)
    renderTape(quotes)
    feedStatus('ceny', true)
  } catch { feedStatus('ceny', false) }
}
if (stash.get('tape')?.length) renderTape(stash.get('tape'))
loadTape()
setInterval(() => { if (!document.hidden) loadTape() }, 60000)

// Fit all candles but leave free space to the right of the last one, so the price has room.
function fitPanel(p) {
  const count = p.candles?.length || 0
  if (count > 1) p.chart.timeScale().setVisibleLogicalRange({ from: -0.5, to: count - 1 + Math.max(6, Math.round(count * 0.06)) })
  else p.chart.timeScale().fitContent()
}
function showChart(p, d) {
  if (p.loaded !== frame) { p.series.setData(d.candles); p.candles = d.candles; fitPanel(p) } else p.series.setData(d.candles)
  p.loaded = frame
  p.candles = d.candles
  p.drawings.redraw()
  const change = d.price - d.previousClose, pct = change / d.previousClose * 100
  const sign = change >= 0 ? '+' : '−', abs = Math.abs
  const hi = Math.max(...d.candles.map(c => c.high)), lo = Math.min(...d.candles.map(c => c.low))
  p.cell.querySelector('.nm').textContent = d.name
  p.cell.querySelector('.fsym').textContent = p.symbol
  p.cell.querySelector('.px').textContent = `${fmt(d.price)}  ${sign}${fmt(abs(change))} (${sign}${abs(pct).toFixed(2)}%)`
  p.cell.querySelector('.tfl').textContent = `timeframe ${frame}`
  p.cell.querySelector('.rows').innerHTML =
    row('last', fmt(d.price)) + row('change', `${sign}${abs(pct).toFixed(2)}%`) + row('high', fmt(hi)) + row('low', fmt(lo))
  p.el.querySelector('.err')?.remove()
}
async function load(p) {
  const key = `chart:${p.symbol}:${frame}`
  if (p.loaded !== frame) { const saved = stash.get(key); if (saved?.candles?.length) showChart(p, saved) }
  try {
    const r = await fetch(`/api/chart?symbol=${encodeURIComponent(p.symbol)}&interval=${frame}`)
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || r.status)
    showChart(p, d)
    stash.put(key, d)
    loadCycles(p)
    return true
  } catch (e) {
    if (!p.el.querySelector('.err')) p.el.insertAdjacentHTML('beforeend', `<div class="err">brak danych: ${e.message}</div>`)
    return false
  }
}

// Number of visible charts (1-4) and the panel that receives tickers clicked in the tape.
let count = Number(localStorage.getItem('count'))
if (![1, 2, 3, 4].includes(count)) count = 4
let active = 0
function setActive(i) {
  active = i
  panels.forEach((p, n) => p.cell.classList.toggle('active', n === i && count > 1))
}
function applyLayout() {
  $('charts').className = 'page n' + count
  panels.forEach((p, n) => { p.cell.hidden = n >= count })
  $('lay').querySelectorAll('button').forEach(b => b.classList.toggle('active', Number(b.dataset.n) === count))
  setActive(Math.min(active, count - 1))
  // The grid resizes the charts asynchronously; refit once it has settled.
  requestAnimationFrame(() => panels.slice(0, count).forEach(fitPanel))
}
$('lay').onclick = e => {
  const n = Number(e.target.closest('button')?.dataset.n)
  if (!n || n === count) return
  count = n
  localStorage.setItem('count', String(n))
  applyLayout()
  refresh()
}
$('tapeTrack').addEventListener('click', e => {
  const chart = e.target.closest('.q')?.dataset.c
  if (!chart) return
  tab('charts')
  setSymbol(panels[active], chart)
})

// One refresh at a time: opening a page, changing the layout and the timer must not stack requests.
let refreshing = null
function refresh() {
  return refreshing ||= (async () => {
    lastRefresh = Date.now()
    const ok = await Promise.all(panels.slice(0, count).map(load))
    feedStatus('wykresy', ok.every(Boolean))
  })().finally(() => { refreshing = null })
}

$('tf').innerHTML = '<span>timeframe</span>' + FRAMES.map(f => `<button data-f="${f}" class="${f === frame ? 'active' : ''}">${f}</button>`).join('')
$('tf').onclick = e => {
  const f = e.target.dataset.f
  if (!f) return
  frame = f
  localStorage.setItem('frame', f)
  $('tf').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.f === f))
  refresh()
}

// Heavy pages load their code on first use (or ahead of time: hovering a tab, idle time after start),
// so the first screen parses and runs as little as possible. Files keep their order: each list runs in sequence.
const LAZY = {
  monitor: ["world-data.js", "world-labels.js", "monitor-geo.js", "monitor.js"],
  'post-creator': ["post-creator-icons.js", "post-creator.js"],
  other: ["terminal-extra-data.js", "other.js"],
}
const lazyLoads = {}
function need(name) {
  if (!LAZY[name]) return Promise.resolve()
  return lazyLoads[name] ||= new Promise((resolve, reject) => {
    LAZY[name].forEach((src, i, files) => {
      const script = document.createElement('script')
      script.src = src
      script.async = false   // download in parallel, execute in list order
      if (i === files.length - 1) script.onload = resolve
      script.onerror = () => { delete lazyLoads[name]; reject(new Error('Nie udało się wczytać ' + src)) }
      document.head.append(script)
    })
  })
}
const monitorLoaded = () => typeof Monitor !== 'undefined'
// Framed pages (calendar, quarters, L/H) are created once and then kept, so switching back is instant.
// Kalendarz and Kwartały are two views of one page, so they share one frame in the Kwartały section and switch with
// its #events / #timeline fragment (no reload). The L/H page has its own frame.
const FRAME_OF = { calendar: ['quarters', '#events'], quarters: ['quarters', '#timeline'], highs: ['highs', ''] }
function ensureFrame(name, navigate) {
  const spec = FRAME_OF[name]
  if (!spec) return
  const [host, fragment] = spec, url = (host === 'highs' ? HIGHS_URL : QUARTERS_URL.split('#')[0]) + fragment
  const frame = $(host).querySelector('iframe')
  if (!frame) { $(host).innerHTML = `<iframe src="${url}" title="${host === 'highs' ? 'Aktualne L/H' : 'Kwartały'}"></iframe>`; return }
  if (navigate && frame.getAttribute('src') !== url) frame.src = url
}
// Framed pages poll and redraw on timers; tell each whether it is on screen so hidden ones can pause.
function syncFrames() {
  requestAnimationFrame(() => document.querySelectorAll('main iframe').forEach(frame => {
    if ((frame.getAttribute('src') || '').startsWith('quarters/')) frame.contentWindow?.postMessage({ type: 'frame-visibility', visible: !!frame.offsetParent }, '*')
  }))
}
document.querySelector('main').addEventListener('load', e => { if (e.target.tagName === 'IFRAME') syncFrames() }, true)
// Warm a page before it is clicked: code and frame start loading on hover (desktop) or touch-down (phones).
function prefetch(name) { need(name).catch(() => {}); ensureFrame(name) }
let chartsLaidOut = false, lastRefresh = 0
const chartsVisible = () => current() === 'charts' || current() === 'home' && Home.has('charts')

let activeTab = 'home'
function tab(name, otherTool) {
  activeTab = name
  document.querySelectorAll('nav .tabs > button').forEach(b => b.classList.toggle('active', b.dataset.tab === name))
  Home.leave()
  const section = FRAME_OF[name]?.[0] || name   // Kalendarz is shown in the shared Kwartały frame
  for (const id of TABS) $(id).hidden = id !== section
  if (name === 'home') Home.enter()
  if (name === 'hyper-terminal' || name === 'home' && Home.has('hyper-terminal')) HyperTerminal.show()
  if (name === 'post-creator') need('post-creator').then(() => { if (current() === 'post-creator') PostCreator.show() })
  if (name === 'other') need('other').then(() => { if (current() === 'other') Other.show(otherTool) })
  else if (name === 'home' && Home.otherTools().length) need('other').then(() => { if (current() === 'home') Other.showWidgets(Home.otherTools()) })
  else if (typeof Other !== 'undefined') Other.hide()
  // Charts and the map may be shown by their own page or as a widget on the dashboard.
  const chartsShown = name === 'charts' || name === 'home' && Home.has('charts')
  $('tf').hidden = !chartsShown
  $('lay').hidden = !chartsShown
  const wantsMonitor = () => current() === 'monitor' || current() === 'home' && Home.has('monitor')
  if (wantsMonitor()) need('monitor').then(() => { if (wantsMonitor()) Monitor.show() })
  else if (monitorLoaded()) Monitor.hide()
  ensureFrame(name, true)
  syncFrames()
  // Charts keep their zoom and data when revisited; they only reload when the data is older than 20 s.
  if (chartsShown) {
    if (!chartsLaidOut) { chartsLaidOut = true; applyLayout() }
    if (Date.now() - lastRefresh > 20000) refresh()
  }
  $('side').hidden = name === 'news' || !sideOpen
  history.replaceState(null, '', '#' + name)
}
for (const type of ['pointerenter', 'pointerdown', 'focusin']) document.querySelector('nav').addEventListener(type, e => {
  const t = e.target.closest?.('[data-tab]')
  if (t) prefetch(t.dataset.tab)
}, { capture: true, passive: true })
document.querySelector('nav').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]')
  if (!t) return
  tab(t.dataset.tab)
})
addEventListener('keydown', e => { const n = { F1: 'charts', F2: 'hyper-terminal', F3: 'post-creator', F4: 'calendar', F5: 'news', F6: 'quarters', F7: 'highs', F8: 'monitor', F9: 'home', F10: 'other' }[e.key]; if (n) { e.preventDefault(); tab(n) } })

const clockFormat = new Intl.DateTimeFormat('pl-PL', { dateStyle: 'short', timeStyle: 'medium', hour12: false })
setInterval(() => { if (!document.hidden) $('clock').textContent = clockFormat.format(new Date()) }, 1000)
let sideOpen = localStorage.getItem('side') !== 'closed'
const current = () => activeTab
$('sideToggle').onclick = () => {
  sideOpen = !sideOpen
  localStorage.setItem('side', sideOpen ? 'open' : 'closed')
  $('sideToggle').classList.toggle('active', sideOpen)
  tab(current())
}
$('sideToggle').classList.toggle('active', sideOpen)

// Headlines from FinancialJuice (server scrapes its RSS feed).
let headlines = [], seen = new Set()
let lang = localStorage.getItem('lang') === 'en' ? 'en' : 'pl'   // headlines are translated to Polish on the server
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = lang === 'pl' ? 'en' : 'pl'
  localStorage.setItem('lang', lang)
  renderNews()
  if (monitorLoaded()) Monitor.rerenderLists()
})
const hourMinute = new Intl.DateTimeFormat('pl-PL', { hour: '2-digit', minute: '2-digit' })
const clock = t => hourMinute.format(new Date(t))
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
function renderNews(fresh = new Set()) {
  document.querySelectorAll('[data-lang]').forEach(b => b.textContent = lang.toUpperCase())
  const q = $('newsFilter').value.trim().toLowerCase()
  const list = (items, limit) => items.slice(0, limit).map(i =>
    `<a class="item${fresh.has(i.id) ? ' new' : ''}" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer"><time>${clock(i.time)}</time><span class="t"${lang === 'pl' && i.pl ? ` title="${esc(i.title)}"` : ''}>${esc(lang === 'pl' && i.pl ? i.pl : i.title)}</span></a>`).join('') || '<div class="none">brak wydarzeń</div>'
  $('newsSide').innerHTML = list(headlines, 60)
  document.querySelectorAll('[data-news]').forEach(el => { el.innerHTML = list(headlines, 60) })
  $('newsFull').innerHTML = list(q ? headlines.filter(i => (i.title + ' ' + i.pl).toLowerCase().includes(q)) : headlines, 200)
}
async function loadNews() {
  try {
    const r = await fetch('/api/news')
    const d = await r.json()
    if (!r.ok) throw new Error(d.error)
    const fresh = new Set(seen.size ? d.items.filter(i => !seen.has(i.id)).map(i => i.id) : [])
    d.items.forEach(i => seen.add(i.id))
    headlines = d.items
    stash.put('news', d.items.slice(0, 120))
    renderNews(fresh)
    feedStatus('wydarzenia', true)
  } catch { feedStatus('wydarzenia', false); if (!headlines.length) $('newsSide').innerHTML = '<div class="none">FinancialJuice chwilowo niedostępne, ponawiam…</div>' }
}
$('newsFilter').oninput = () => renderNews()
const savedNews = stash.get('news')
if (savedNews?.length) { headlines = savedNews; savedNews.forEach(i => seen.add(i.id)); renderNews() }
loadNews()
setInterval(() => { if (!document.hidden) loadNews() }, 60000)

applyLayout(); chartsLaidOut = true
tab(TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home')
// Once the first screen is up, load the Monitor code in idle time (Post Creator draws its icons when it starts,
// so it is warmed only when its tab is hovered or touched).
;(window.requestIdleCallback || (fn => setTimeout(fn, 2000)))(() => need('monitor').catch(() => {}), { timeout: 5000 })
setInterval(() => { if (!document.hidden && chartsVisible()) refresh() }, 30000)
</script>
</body>
</html>
