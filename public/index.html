<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNC Terminal</title>
<style>
:root{--bg:#050505;--line:#3a3a34;--ink:#ebe6d3;--dim:#8c8a7c;--faint:#1c1c19}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
body{display:flex;flex-direction:column;padding:10px;gap:10px}
.bar{display:flex;align-items:center;gap:16px;color:var(--dim)}
.bar .brand{color:var(--ink);letter-spacing:.2em}
.bar .clock{margin-left:auto}
nav{display:flex;align-items:stretch;border:1px solid var(--line)}
nav button{background:none;border:0;border-right:1px solid var(--line);color:var(--dim);font:inherit;padding:8px 16px;cursor:pointer;text-transform:uppercase;letter-spacing:.12em}
nav button b{margin-right:8px;font-weight:400;opacity:.6}
nav button:hover{color:var(--ink)}
nav button.active{background:var(--ink);color:var(--bg)}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 10px}
.tools span{color:var(--dim);margin-right:4px}
.tools button{border:1px solid var(--line);padding:3px 10px;letter-spacing:.08em}
.tools button.active{border-color:var(--ink)}
.tools .side-toggle{margin-left:10px}
#tape{overflow:hidden;border-bottom:1px solid var(--faint);padding:5px 0;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tape .track{display:flex;width:max-content;animation:tape 900s linear infinite}
#tape:hover .track{animation-play-state:paused}
#tape .q{display:flex;gap:8px;padding:0 16px;color:var(--dim);white-space:nowrap}
#tape .q b{color:var(--ink);font-weight:400}
@keyframes tape{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#tape .track{animation:none}#tape{overflow-x:auto}}
.shell{flex:1;min-height:0;display:flex;gap:10px}
main{flex:1;min-width:0;position:relative}
#side{width:300px;flex:none;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px 12px}
#side h4,.news-page h4{margin:0 0 8px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.16em;font-weight:700}
#side h4 i{font-style:normal;font-weight:400;color:var(--dim);letter-spacing:0;text-transform:none}
.feed{flex:1;min-height:0;overflow-y:auto;scrollbar-color:var(--line) var(--bg);scrollbar-width:thin}
.item{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--faint);color:var(--ink);text-decoration:none}
.item:hover .t{text-decoration:underline;text-underline-offset:3px}
.item time{flex:none;color:var(--dim);width:38px}
.item.new .t{font-weight:700}
.lang{background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:11px;padding:1px 7px;cursor:pointer}
.newsbar{display:flex;gap:8px}.newsbar input{flex:1}
.feed .none{color:var(--dim);padding:8px 0}
.news-page{position:absolute;inset:0;border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.news-page input{background:transparent;border:1px solid var(--line);color:var(--ink);font:inherit;padding:8px 10px;color-scheme:dark}
.news-page .item{font-size:13px;padding:9px 0}
.news-page .item time{width:90px}
@media(max-width:1100px){#side{display:none}}
.page{position:absolute;inset:0}
[hidden]{display:none!important}
#charts{display:grid;grid-template:1fr 1fr / 1fr 1fr;gap:10px}
.cell{border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 12px 8px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.head .sym{font:inherit;font-weight:700;width:9ch;margin-right:10px;padding:1px 4px;background:transparent;color:var(--ink);border:1px solid transparent;text-transform:uppercase}
.head .sym:hover{border-color:var(--line)}.head .sym:focus{border-color:var(--ink);outline:none}
.head .name{color:var(--dim)}
.sub{color:var(--dim);margin-bottom:8px}
.body{flex:1;min-height:0;display:flex;gap:14px}
.chart{flex:1;min-width:0;position:relative}
.twin{width:170px;flex:none;display:flex;flex-direction:column}
.twin h4{margin:0 0 4px;display:flex;justify-content:space-between;font-weight:700}
.twin h4 i{font-style:normal;font-weight:400;color:var(--dim)}
.twin div.r{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-top:1px solid var(--faint)}
.twin div.r span{color:var(--dim)}
@media(max-height:1100px){.twin .frame{display:none}}
.twin .r.cyc{border-top-color:var(--line)}
.twin .r.cyc b{font-weight:400;letter-spacing:.02em}
.twin .r.cyc span{cursor:help}
.twin .frame{margin-top:auto;border:1px solid var(--line);padding:6px 8px;color:var(--dim)}
.twin .frame b{color:var(--ink);display:block}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);text-align:center;padding:20px}
iframe{width:100%;height:100%;border:1px solid var(--line);background:#080a0e}
footer{display:flex;gap:18px;color:var(--dim)}
footer .live{color:var(--ink)}
@media(max-width:900px){#charts{grid-template:repeat(4,minmax(320px,1fr))/1fr;overflow:auto}.twin{display:none}}
</style>
</head>
<body>
<div class="bar"><span class="brand">UNC ~ · TERMINAL</span><span class="clock" id="clock"></span></div>
<nav>
  <button data-tab="charts" class="active"><b>F1</b>Wykresy</button>
  <button data-tab="calendar"><b>F2</b>Kalendarz ekonomiczny</button>
  <button data-tab="news"><b>F3</b>Wydarzenia</button>
  <button data-tab="quarters"><b>F4</b>Kwartały</button>
  <button data-tab="highs"><b>F5</b>Aktualne L/H</button>
  <div class="tools" id="tf"></div>
  <div class="tools" style="margin-left:0"><button class="side-toggle active" id="sideToggle" title="Pasek wydarzeń">Wydarzenia ▸</button></div>
</nav>
<div id="tape" aria-label="Najpopularniejsze instrumenty świata"><div class="track" id="tapeTrack"></div></div>
<div class="shell">
<main>
  <section class="page" id="charts"></section>
  <section class="page" id="calendar" hidden></section>
  <section class="page" id="news" hidden><div class="news-page"><div class="newsbar"><input id="newsFilter" type="search" placeholder="filtr wydarzeń…" aria-label="Filtr wydarzeń"><button class="lang" data-lang aria-label="Język nagłówków">PL</button></div><div class="feed" id="newsFull"></div></div></section>
  <section class="page" id="quarters" hidden></section>
  <section class="page" id="highs" hidden></section>
</main>
<aside id="side" aria-label="Wydarzenia na żywo"><h4>wydarzenia <i>financialjuice · <button class="lang" data-lang aria-label="Język nagłówków">PL</button></i></h4><div class="feed" id="newsSide"></div></aside>
</div>
<footer><span class="live" id="status">● łączenie…</span><span id="updated"></span></footer>
<script src="lightweight-charts.js"></script>
<script src="cycle-rules.js"></script>
<script src="day-highs.js"></script>
<script src="terminal-data.js"></script>
<script>
// Kalendarz przekierowuje do widoku wydarzeń z qs2.0 (Timeline/Wydarzenia).
const CALENDAR_URL = 'quarters/index.html#events'
const QUARTERS_URL = 'quarters/index.html'
const HIGHS_URL = 'quarters/highs.html'
const TABS = ['charts', 'calendar', 'news', 'quarters', 'highs']
const DEFAULTS = ['NQ1!', 'ES1!', 'YM1!', 'DXY1!']
const PRESETS = ['NQ1!', 'ES1!', 'YM1!', 'RTY1!', 'DXY1!', 'BTC1!', 'ETH1!', 'GC1!', 'SI1!', 'CL1!', 'NG1!', 'ZN1!', '6E1!', 'BTC-USD', 'ETH-USD', 'SOL-USD', 'AAPL', 'NVDA', 'TSLA', 'SPY', 'QQQ']
let saved = []
try { saved = JSON.parse(localStorage.getItem('symbols') || '[]') } catch {}
const SYMBOLS = DEFAULTS.map((d, i) => /^[A-Z0-9][A-Z0-9.^=!-]{0,14}$/.test(saved[i] || '') ? saved[i] : d)
const FRAMES = ['1M', '1W', '1D', '6H']
let frame = localStorage.getItem('frame')
if (!FRAMES.includes(frame)) frame = '1D'

const INK = '#ebe6d3', DIM = '#8c8a7c', BG = '#050505'
const $ = id => document.getElementById(id)
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const row = (k, v) => `<div class="r"><span>${k}</span>${v}</div>`

const panels = SYMBOLS.map((symbol, i) => {
  const cell = document.createElement('div')
  cell.className = 'cell'
  cell.innerHTML = `
    <div class="head"><div><input class="sym" list="presets" value="${symbol}" spellcheck="false" autocomplete="off" aria-label="Ticker" title="Wpisz ticker (np. BTC1!, ETH1!, GC1!, AAPL) i naciśnij Enter"><span class="name nm"></span></div><span class="name px"></span></div>
    <div class="sub">1 candle = 1 period · <span class="tfl"></span></div>
    <div class="body"><div class="chart"></div>
      <aside class="twin"><h4>numeric twin <i>as values</i></h4><div class="rows"></div><div class="cycles"></div>
        <div class="frame"><b class="fsym">${symbol}</b>Yahoo Finance<br>panel 0${i + 1}/04</div></aside></div>`
  $('charts').append(cell)
  const el = cell.querySelector('.chart')
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: BG }, textColor: DIM, fontFamily: 'ui-monospace,Menlo,monospace', fontSize: 11 },
    grid: { vertLines: { visible: false }, horzLines: { color: '#1c1c19', style: 1 } },
    rightPriceScale: { borderColor: '#3a3a34' },
    timeScale: { borderColor: '#3a3a34', timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0, vertLine: { color: DIM, labelBackgroundColor: '#3a3a34' }, horzLine: { color: DIM, labelBackgroundColor: '#3a3a34' } },
  })
  // Monochrome candles: up = filled, down = hollow outline.
  const series = chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: INK, downColor: BG, borderUpColor: INK, borderDownColor: INK, wickUpColor: INK, wickDownColor: INK,
    priceLineStyle: 3, priceLineColor: INK, priceLineWidth: 1,
  })
  const panel = { symbol, cell, el, chart, series, tick: null, input: cell.querySelector('.sym') }
  panel.input.onchange = () => setSymbol(panel, panel.input.value)
  panel.input.onkeydown = e => { if (e.key === 'Enter') panel.input.blur() }
  panel.input.onfocus = () => panel.input.select()
  return panel
})
document.body.insertAdjacentHTML('beforeend', `<datalist id="presets">${PRESETS.map(p => `<option value="${p}">`).join('')}</datalist>`)

async function setSymbol(p, raw) {
  const symbol = raw.trim().toUpperCase().replace(/\s+/g, '')
  if (!symbol || symbol === p.symbol) { p.input.value = p.symbol; return }
  const previous = p.symbol
  p.symbol = symbol
  p.loaded = null
  if (await load(p)) {
    p.input.value = symbol
    localStorage.setItem('symbols', JSON.stringify(panels.map(x => x.symbol)))
  } else {
    // Unknown ticker: restore the previous chart instead of leaving an empty panel.
    p.symbol = previous
    p.input.value = previous
    p.loaded = null
    await load(p)
    p.el.querySelector('.err')?.remove()
    p.cell.querySelector('.nm').textContent = `„${symbol}” — nie znaleziono w Yahoo`
  }
}

// Cycle of each extreme, from the timeline's rules: [Quarterly, Monthly, Weekly] for the month,
// [Monthly, Weekly, Daily] for the week and [Weekly, Daily, Session] for the day.
const CYCLES = [
  ['HOTM', 'hotm', 'High of the month: Quarterly · Monthly · Weekly'], ['LOTM', 'lotm', 'Low of the month: Quarterly · Monthly · Weekly'],
  ['HOTW', 'hotw', 'High of the week: Monthly · Weekly · Daily'], ['LOTW', 'lotw', 'Low of the week: Monthly · Weekly · Daily'],
  ['HOTD', 'hotd', 'High of the day: Weekly · Daily · Session'], ['LOTD', 'lotd', 'Low of the day: Weekly · Daily · Session'],
]
const cycleRows = (d, waiting) => CYCLES.map(([k, key, tip]) =>
  `<div class="r cyc"><span title="${tip}">${k}</span><b>${d?.[key] ? d[key].join(' · ') : waiting ? '…' : '—'}</b></div>`).join('')
const cycleCache = {}
async function loadCycles(p) {
  const symbol = p.symbol
  const box = p.cell.querySelector('.cycles')
  if (cycleCache[symbol] && Date.now() - cycleCache[symbol].at < 60000) { box.innerHTML = cycleRows(cycleCache[symbol].data); return }
  if (p.cyclesFor !== symbol) box.innerHTML = cycleRows(null, true)
  p.cyclesFor = symbol
  try {
    const r = await fetch('/api/highs?symbol=' + encodeURIComponent(symbol))
    const data = await r.json()
    if (!r.ok) throw new Error(data.error)
    cycleCache[symbol] = { at: Date.now(), data }
    if (p.symbol === symbol) box.innerHTML = cycleRows(data)
  } catch { if (p.symbol === symbol) box.innerHTML = cycleRows(null) }
}

// Slowly scrolling tape of the most followed instruments (built once, values refreshed in place).
const tapeFmt = n => n.toLocaleString('en-US', { minimumFractionDigits: n < 10 ? 4 : 2, maximumFractionDigits: n < 10 ? 4 : 2 })
async function loadTape() {
  try {
    const { quotes } = await (await fetch('/api/tape')).json()
    if (!quotes.length) return
    const cell = q => `<span class="q" data-s="${q.symbol}"><b>${q.symbol}</b>${tapeFmt(q.price)}<span>${q.change == null ? '' : (q.change >= 0 ? '+' : '−') + Math.abs(q.change).toFixed(2) + '%'}</span></span>`
    const track = $('tapeTrack')
    if (track.children.length === quotes.length * 2) {
      // Same instruments: update text only so the scroll position is not reset.
      track.querySelectorAll('.q').forEach((el, i) => { const q = quotes[i % quotes.length]; el.innerHTML = cell(q).replace(/^<span[^>]*>|<\/span>$/g, '') })
    } else {
      const html = quotes.map(cell).join('')
      track.innerHTML = html + html
      // ~5 s per instrument keeps it readable.
      track.style.animationDuration = quotes.length * 5 + 's'
    }
  } catch {}
}
loadTape()
setInterval(() => { if (!document.hidden) loadTape() }, 60000)

async function load(p) {
  try {
    const r = await fetch(`/api/chart?symbol=${encodeURIComponent(p.symbol)}&interval=${frame}`)
    const d = await r.json()
    if (!r.ok) throw new Error(d.error || r.status)
    if (p.loaded !== frame) { p.series.setData(d.candles); p.chart.timeScale().fitContent() } else p.series.setData(d.candles)
    p.loaded = frame
    const change = d.price - d.previousClose, pct = change / d.previousClose * 100
    const sign = change >= 0 ? '+' : '−', abs = Math.abs
    const hi = Math.max(...d.candles.map(c => c.high)), lo = Math.min(...d.candles.map(c => c.low))
    p.cell.querySelector('.nm').textContent = d.name
    p.cell.querySelector('.fsym').textContent = p.symbol
    p.cell.querySelector('.px').textContent = `${fmt(d.price)}  ${sign}${fmt(abs(change))} (${sign}${abs(pct).toFixed(2)}%)`
    p.cell.querySelector('.tfl').textContent = `timeframe ${frame}`
    p.cell.querySelector('.rows').innerHTML =
      row('last', fmt(d.price)) + row('change', `${sign}${abs(pct).toFixed(2)}%`) + row('high', fmt(hi)) + row('low', fmt(lo))
    p.el.querySelector('.err')?.remove()
    loadCycles(p)
    return true
  } catch (e) {
    if (!p.el.querySelector('.err')) p.el.insertAdjacentHTML('beforeend', `<div class="err">brak danych: ${e.message}</div>`)
    return false
  }
}

async function refresh() {
  const ok = await Promise.all(panels.map(load))
  $('status').textContent = ok.every(Boolean) ? '● na żywo' : '● błąd danych'
  $('updated').textContent = 'aktualizacja: ' + new Date().toLocaleTimeString('pl-PL')
}

$('tf').innerHTML = '<span>timeframe</span>' + FRAMES.map(f => `<button data-f="${f}" class="${f === frame ? 'active' : ''}">${f}</button>`).join('')
$('tf').onclick = e => {
  const f = e.target.dataset.f
  if (!f) return
  frame = f
  localStorage.setItem('frame', f)
  $('tf').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.f === f))
  refresh()
}

// The qs2.0 pages are loaded lazily, only when their tab is opened.
function tab(name) {
  document.querySelectorAll('nav > button').forEach(b => b.classList.toggle('active', b.dataset.tab === name))
  for (const id of TABS) $(id).hidden = id !== name
  $('tf').hidden = name !== 'charts'
  const url = { calendar: CALENDAR_URL, quarters: QUARTERS_URL, highs: HIGHS_URL }[name]
  if (url && !$(name).firstChild) $(name).innerHTML = `<iframe src="${url}" title="${name}"></iframe>`
  if (name === 'charts') panels.forEach(p => p.chart.timeScale().fitContent())
  $('side').hidden = name === 'news' || !sideOpen
  history.replaceState(null, '', '#' + name)
}
document.querySelector('nav').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (t) tab(t.dataset.tab) })
addEventListener('keydown', e => { const n = { F1: 'charts', F2: 'calendar', F3: 'news', F4: 'quarters', F5: 'highs' }[e.key]; if (n) { e.preventDefault(); tab(n) } })

setInterval(() => $('clock').textContent = new Date().toLocaleString('pl-PL', { hour12: false }), 1000)
let sideOpen = localStorage.getItem('side') !== 'closed'
const current = () => TABS.find(id => !$(id).hidden)
$('sideToggle').onclick = () => {
  sideOpen = !sideOpen
  localStorage.setItem('side', sideOpen ? 'open' : 'closed')
  $('sideToggle').classList.toggle('active', sideOpen)
  tab(current())
}
$('sideToggle').classList.toggle('active', sideOpen)

// Headlines from FinancialJuice (server scrapes its RSS feed).
let headlines = [], seen = new Set()
let lang = localStorage.getItem('lang') === 'en' ? 'en' : 'pl'   // headlines are translated to Polish on the server
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  lang = lang === 'pl' ? 'en' : 'pl'
  localStorage.setItem('lang', lang)
  renderNews()
})
const clock = t => new Date(t).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
function renderNews(fresh = new Set()) {
  document.querySelectorAll('[data-lang]').forEach(b => b.textContent = lang.toUpperCase())
  const q = $('newsFilter').value.trim().toLowerCase()
  const list = (items, limit) => items.slice(0, limit).map(i =>
    `<a class="item${fresh.has(i.id) ? ' new' : ''}" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer"><time>${clock(i.time)}</time><span class="t"${lang === 'pl' && i.pl ? ` title="${esc(i.title)}"` : ''}>${esc(lang === 'pl' && i.pl ? i.pl : i.title)}</span></a>`).join('') || '<div class="none">brak wydarzeń</div>'
  $('newsSide').innerHTML = list(headlines, 60)
  $('newsFull').innerHTML = list(q ? headlines.filter(i => (i.title + ' ' + i.pl).toLowerCase().includes(q)) : headlines, 200)
}
async function loadNews() {
  try {
    const r = await fetch('/api/news')
    const d = await r.json()
    if (!r.ok) throw new Error(d.error)
    const fresh = new Set(seen.size ? d.items.filter(i => !seen.has(i.id)).map(i => i.id) : [])
    d.items.forEach(i => seen.add(i.id))
    headlines = d.items
    renderNews(fresh)
  } catch { if (!headlines.length) $('newsSide').innerHTML = '<div class="none">FinancialJuice chwilowo niedostępne, ponawiam…</div>' }
}
$('newsFilter').oninput = () => renderNews()
loadNews()
setInterval(() => { if (!document.hidden) loadNews() }, 60000)

tab(TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'charts')
refresh()
setInterval(() => { if (!document.hidden) refresh() }, 30000)
</script>
</body>
</html>
